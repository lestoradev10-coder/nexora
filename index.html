<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nexora - Coming Soon</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* reset and base — no box-layout constraints */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;   /* kept for sanity, but no "box layout" restrictions */
      font-family: 'Space Grotesk', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 20%, #0b1a1a, #030507);
      color: white;
      overflow: hidden;
      padding: 20px;
      position: relative;
    }

    /* layered ambient glow — no box-like card background */
    .bg-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 25%, rgba(45,212,191,0.20), transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(129,140,248,0.18), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), transparent 70%);
      filter: blur(70px);
      pointer-events: none;
    }

    /* main content – no card border/background, just floating content */
    .hero {
      position: relative;
      width: 100%;
      max-width: 780px;
      padding: 40px 30px;
      text-align: center;
      /* no background, no backdrop, no border — just content */
    }

    .logo {
      width: 230px;
      margin: 0 auto 20px;
      display: block;
      border-radius: 20px;
      filter: drop-shadow(0 0 30px rgba(45,212,191,0.3));
      animation: float 3.5s ease-in-out infinite;
      transition: filter 0.3s;
    }

    .logo:hover {
      filter: drop-shadow(0 0 50px rgba(45,212,191,0.6));
    }

    h1 {
      font-size: clamp(2.6rem, 7vw, 4.2rem);
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f0f9ff 0%, #a5f3fc 40%, #818cf8 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(45,212,191,0.15);
    }

    .divider {
      width: 100px;
      height: 2.5px;
      background: linear-gradient(90deg, transparent, #2dd4bf, #818cf8, transparent);
      margin: 24px auto 28px;
      border-radius: 4px;
      opacity: 0.7;
    }

    p {
      font-size: 1.2rem;
      font-weight: 300;
      opacity: 0.85;
      line-height: 1.8;
      letter-spacing: 0.2px;
      max-width: 600px;
      margin: 0 auto;
      color: rgba(255,255,255,0.9);
    }

    p span {
      color: #2dd4bf;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-shadow: 0 0 20px rgba(45,212,191,0.25);
    }

    .badge {
      margin-top: 30px;
      display: inline-block;
      padding: 10px 30px;
      border: 1px solid rgba(45,212,191,0.25);
      border-radius: 60px;
      font-size: 0.85rem;
      letter-spacing: 0.4em;
      color: rgba(255,255,255,0.6);
      background: rgba(45,212,191,0.04);
      backdrop-filter: blur(2px);
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .badge:hover {
      border-color: #2dd4bf;
      color: white;
      background: rgba(45,212,191,0.08);
      box-shadow: 0 0 30px rgba(45,212,191,0.15);
    }

   footer {
  position: absolute;
  bottom: 40px;  /* increased from 24px → moves it a little up */
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 0.75rem;
  letter-spacing: 0.5px;
  opacity: 0.35;
  color: #a5b4c7;
  font-weight: 300;
}

    /* simple keyframes */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    /* no card, no box — just clean responsive */
    @media (max-width: 600px) {
      .hero {
        padding: 20px 16px;
      }

      .logo {
        width: 200px;
      }

      p {
        font-size: 1rem;
        padding: 0 10px;
      }

      .badge {
        padding: 8px 24px;
        font-size: 0.75rem;
      }
    }

    /* remove any possible box-like border or background from .hero */
    .hero {
      background: transparent;
      backdrop-filter: none;
      border: none;
      box-shadow: none;
    }
    @media (max-width: 600px) {
  p {
    font-size: 0.95rem;
    line-height: 1.5;
  }
}
  </style>
</head>
<body>

  <!-- ambient background glow (no box) -->
  <div class="bg-glow"></div>

  <!-- main content — completely free from box-layout -->
  <div class="hero">

    <!-- logo with alt text -->
    <img class="logo" src="logo.png" alt="Nexora brand logo">

    <h1>WE'RE BUILDING<br>SOMETHING GREAT</h1>

    <div class="divider"></div>

    <p>
      We're working hard to give you the <span>best experience</span>.<br>
      Stay tuned for something <span>amazing</span>.
    </p>

    <div class="badge">Coming Soon</div>

  </div>

  <footer>
  © 2026 Nexora Solution Hub. All rights reserved.

  </footer>

</body>
</html>
